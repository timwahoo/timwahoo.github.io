<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark light" />
  <title>Personal site</title>
  <meta name="description" content="A personal website." />
  <meta property="og:title" content="Personal site" />
  <meta property="og:description" content="A personal website." />
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script>
    /* pick the theme before the first paint — no flash of the wrong mode */
    (function () {
      try {
        var t = localStorage.getItem("site-theme");
        if (t !== "light" && t !== "dark") {
          t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        }
        document.documentElement.dataset.theme = t;
      } catch (e) {
        document.documentElement.dataset.theme = "dark";
      }
    })();
  </script>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="about">

  <noscript>
    <p class="noscript-note">This site renders its content with JavaScript — please enable it to read along.</p>
  </noscript>

  <div class="scroll-progress"></div>

  <nav class="nav">
    <div class="nav-inner">
      <a class="brand" href="index.html" aria-label="Home">
        <span class="brand-dot"></span>
        <span data-bind="identity.firstName"></span> <em data-bind="identity.lastName"></em>
      </a>
      <div class="nav-links" data-render="nav"></div>
      <button class="theme-toggle" type="button" data-theme-toggle data-feature="themeToggle" aria-label="Switch to day mode" title="Switch to day mode">
        <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4.2"></circle>
          <path d="M12 2.6v2M12 19.4v2M2.6 12h2M19.4 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M18.7 5.3l-1.4 1.4M6.7 17.3l-1.4 1.4"></path>
        </svg>
        <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20.4 14.8A8.7 8.7 0 0 1 9.2 3.6a8.7 8.7 0 1 0 11.2 11.2Z"></path>
        </svg>
      </button>
      <a class="nav-cta" data-bind="nav.cta.label nav.cta.href|href" data-require="nav.cta"></a>
      <button class="nav-toggle" aria-label="Menu" aria-expanded="false">
        <span></span><span></span>
      </button>
    </div>
  </nav>

  <header class="page-head">
    <div class="wrap">
      <div class="kicker mono" data-bind="about.kicker"></div>
      <h1 data-bind="about.title|html"></h1>
    </div>
  </header>

  <main>
    <section class="section" style="padding-top: clamp(2rem, 5vh, 3.5rem)">
      <div class="wrap">
        <div class="split" style="align-items: center">
          <div class="portrait rv" data-portrait data-feature="portrait" style="max-width: 420px">
            <canvas aria-label="Axial slice of a 1 mm isotropic MGE brain acquisition, drag to scrub through the volume"></canvas>
            <span class="p-corner c1"></span>
            <span class="p-corner c2"></span>
            <span class="p-hint">drag to scrub</span>
            <div class="p-hud">
              <span data-hud-slice>slice 099 / 175</span>
              <span data-hud-z>z = +0.0 mm</span>
            </div>
          </div>

          <div class="body-text rv" style="--d:0.15s">
            <div data-render="paragraphs:about.paragraphs" data-require="about.paragraphs"></div>

            <div class="toolkit" style="margin-top: 2rem" data-render="toolkit" data-require="about.toolkit"></div>
          </div>
        </div>
      </div>
    </section>

    <section class="section section-soft" data-require="about.timeline.items">
      <div class="wrap">
        <div class="sec-head">
          <span class="idx" data-bind="about.timeline.idx"></span>
          <h2 data-bind="about.timeline.heading"></h2>
          <span class="rule"></span>
        </div>
        <div class="timeline" data-render="timeline"></div>
      </div>
    </section>

    <section class="section" id="contact">
      <div class="wrap">
        <div class="split">
          <div>
            <div class="sec-head">
              <span class="idx" data-bind="about.contact.idx"></span>
              <h2 data-bind="about.contact.heading"></h2>
              <span class="rule"></span>
            </div>
            <p class="lead rv" data-bind="about.contact.lead|html"></p>
            <p class="body-text rv" style="--d:0.1s; margin-top: 1.6rem; color: var(--ink-3); max-width: 46ch" data-bind="about.contact.body"></p>
          </div>
          <div class="contact-list rv" style="--d:0.15s" data-render="contact" data-require="links"></div>
        </div>
      </div>
    </section>

    <section class="cta" data-require="about.cta">
      <div class="wrap">
        <h2 class="rv" data-bind="about.cta.heading|html"></h2>
        <p class="rv" style="--d:0.1s" data-bind="about.cta.sub"></p>
        <a class="btn btn-solid rv" style="--d:0.2s" data-bind="about.cta.action.href|href">
          <span data-bind="about.cta.action.label"></span> <span class="arr">→</span>
        </a>
      </div>
    </section>
  </main>

  <footer>
    <div class="wrap">
      <div class="foot-grid">
        <div class="foot-brand">
          <span data-bind="identity.firstName"></span> <em data-bind="identity.lastName"></em>
          <p data-bind="footer.blurb"></p>
        </div>
        <div class="foot-col" data-require="nav.items">
          <h4>Pages</h4>
          <ul data-render="footerPages"></ul>
        </div>
        <div class="foot-col" data-require="links">
          <h4>Elsewhere</h4>
          <ul data-render="footerLinks"></ul>
        </div>
      </div>
      <div class="foot-bar">
        <span>© <span data-year></span> <span data-bind="identity.fullName"></span> — <b data-bind="footer.note"></b> on GitHub Pages</span>
        <span data-bind="footer.stack"></span>
        <span data-bind="footer.builtWith|html"></span>
      </div>
    </div>
  </footer>

  <script type="module" src="js/personalize.js"></script>
  <script type="module" src="js/site.js"></script>
</body>
</html>
