<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark light" />
  <title>Personal site</title>
  <meta name="description" content="A personal website." />
  <meta property="og:title" content="Personal site" />
  <meta property="og:description" content="A personal website." />
  <meta property="og:type" content="website" />
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script>
    /* pick the theme before the first paint — no flash of the wrong mode */
    (function () {
      try {
        var t = localStorage.getItem("site-theme");
        if (t !== "light" && t !== "dark") {
          t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        }
        document.documentElement.dataset.theme = t;
      } catch (e) {
        document.documentElement.dataset.theme = "dark";
      }
    })();
  </script>
  <script>
    /* the visitor may have switched the hero volume off — honour it before
       the first paint, so the WebGL layer never flashes on */
    (function () {
      try {
        if (localStorage.getItem("site-hero") === "off") {
          document.documentElement.dataset.hero = "off";
        }
      } catch (e) {
        /* private mode — the hero simply stays on */
      }
    })();
  </script>
  <link rel="stylesheet" href="css/style.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body data-page="home">

  <noscript>
    <p class="noscript-note">This site renders its content with JavaScript — please enable it to read along.</p>
  </noscript>

  <div class="scroll-progress"></div>

  <nav class="nav">
    <div class="nav-inner">
      <a class="brand" href="index.html" aria-label="Home">
        <span class="brand-dot"></span>
        <span data-bind="identity.firstName"></span> <em data-bind="identity.lastName"></em>
      </a>
      <div class="nav-links" data-render="nav"></div>
      <button class="theme-toggle" type="button" data-theme-toggle data-feature="themeToggle" aria-label="Switch to day mode" title="Switch to day mode">
        <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4.2"></circle>
          <path d="M12 2.6v2M12 19.4v2M2.6 12h2M19.4 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M18.7 5.3l-1.4 1.4M6.7 17.3l-1.4 1.4"></path>
        </svg>
        <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20.4 14.8A8.7 8.7 0 0 1 9.2 3.6a8.7 8.7 0 1 0 11.2 11.2Z"></path>
        </svg>
      </button>
      <button class="hero-toggle" type="button" data-hero-toggle data-feature="heroCanvas" aria-pressed="true" aria-label="Turn off the hero volume" title="Turn off the hero volume">
        <svg class="i-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 3.1 20 7.4v9.2L12 20.9 4 16.6V7.4Z"></path>
          <path d="M4 7.4 12 11.7l8-4.3M12 11.7v9.2"></path>
        </svg>
        <svg class="i-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 3.1 20 7.4v9.2L12 20.9 4 16.6V7.4Z"></path>
          <path d="M4 7.4 12 11.7l8-4.3M12 11.7v9.2"></path>
          <path d="M4.7 19.5 19.5 4.7"></path>
        </svg>
      </button>
      <a class="nav-cta" data-bind="nav.cta.label nav.cta.href|href" data-require="nav.cta"></a>
      <button class="nav-toggle" aria-label="Menu" aria-expanded="false">
        <span></span><span></span>
      </button>
    </div>
  </nav>

  <header class="hero">
    <div class="hero-canvas" data-hero-canvas data-feature="heroCanvas"></div>
    <div class="hero-glow"></div>

    <div class="wrap hero-inner">
      <div class="hero-label mono" data-bind="hero.label"></div>
      <h1 data-render="heroName"></h1>
      <p class="hero-sub" data-bind="hero.sub"></p>
      <div class="hero-actions" data-render="heroActions" data-require="hero.actions"></div>
    </div>

    <div class="wrap hero-foot">
      <div class="hero-readout mono" data-render="readout" data-require="hero.readout"></div>
      <div class="scroll-hint mono">Scroll <i></i></div>
    </div>
  </header>

  <main>
    <div class="marquee" aria-hidden="true" data-feature="marquee" data-require="marquee">
      <div class="marquee-track" data-render="marquee"></div>
    </div>

    <section class="section">
      <div class="wrap">
        <div class="split">
          <div>
            <div class="sec-head">
              <span class="idx" data-bind="home.about.idx"></span>
              <h2 data-bind="home.about.heading|html"></h2>
              <span class="rule"></span>
            </div>
            <p class="lead rv" data-bind="home.about.lead|html" data-require="home.about.lead"></p>
          </div>
          <div class="body-text rv" style="--d:0.15s">
            <div data-render="paragraphs:home.about.paragraphs" data-require="home.about.paragraphs"></div>
            <div class="stats" data-render="stats" data-feature="stats" data-require="home.about.stats"></div>
          </div>
        </div>
      </div>
    </section>

    <section class="section section-soft" data-require="home.directions.items">
      <div class="wrap">
        <div class="sec-head">
          <span class="idx" data-bind="home.directions.idx"></span>
          <h2 data-bind="home.directions.heading"></h2>
          <span class="rule"></span>
        </div>
        <div class="themes" data-render="directions"></div>
      </div>
    </section>

    <section class="section" data-require="home.work.items">
      <div class="wrap">
        <div class="sec-head">
          <span class="idx" data-bind="home.work.idx"></span>
          <h2 data-bind="home.work.heading"></h2>
          <span class="rule"></span>
        </div>
        <div class="cards" data-render="work"></div>
      </div>
    </section>

    <section class="section section-soft" data-require="publications.items">
      <div class="wrap">
        <div class="sec-head">
          <span class="idx" data-bind="home.recent.idx"></span>
          <h2 data-bind="home.recent.heading"></h2>
          <span class="rule"></span>
        </div>
        <div class="pubs" data-pub-preview></div>
        <div style="margin-top: 2.4rem" class="rv">
          <a class="btn btn-ghost" href="publications.html">Full list &amp; BibTeX <span class="arr">→</span></a>
        </div>
      </div>
    </section>

    <section class="cta" data-require="home.cta">
      <div class="wrap">
        <h2 class="rv" data-bind="home.cta.heading|html"></h2>
        <p class="rv" style="--d:0.1s" data-bind="home.cta.sub"></p>
        <a class="btn btn-solid rv" style="--d:0.2s" data-bind="home.cta.action.href|href">
          <span data-bind="home.cta.action.label"></span> <span class="arr">→</span>
        </a>
      </div>
    </section>
  </main>

  <footer>
    <div class="wrap">
      <div class="foot-grid">
        <div class="foot-brand">
          <span data-bind="identity.firstName"></span> <em data-bind="identity.lastName"></em>
          <p data-bind="footer.blurb"></p>
        </div>
        <div class="foot-col" data-require="nav.items">
          <h4>Pages</h4>
          <ul data-render="footerPages"></ul>
        </div>
        <div class="foot-col" data-require="links">
          <h4>Elsewhere</h4>
          <ul data-render="footerLinks"></ul>
        </div>
      </div>
      <div class="foot-bar">
        <span>© <span data-year></span> <span data-bind="identity.fullName"></span> — <b data-bind="footer.note"></b> on GitHub Pages</span>
        <span data-bind="footer.stack"></span>
        <span data-bind="footer.builtWith|html"></span>
      </div>
    </div>
  </footer>

  <script type="module" src="js/personalize.js"></script>
  <script type="module" src="js/site.js"></script>
  <script type="module" src="js/hero.js"></script>
  <script type="module" src="js/publications.js"></script>
</body>
</html>
